# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "september"
version = "0.5.5"
authors = ["Fuwn <contact@fuwn.me>"]
edition = "2021"
description = "A simple and efficient Gemini-to-HTTP proxy."
readme = "README.md"
homepage = "https://github.com/gemrest/september"
repository = "https://github.com/gemrest/september"
license = "GPL-3.0-only"
keywords = ["rust", "gemini", "proxy"]
categories = ["web-programming", "web-programming::http-server"]
rust-version = "1.83.0"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3

[dependencies]
germ = { version = "0.5.2", default-features = false, features = ["ast", "convert", "meta", "request"] }
anyhow = "1"
actix-web = "4.11.0"
tokio = { version = "1", features = ["net", "io-util", "time"] }
pretty_env_logger = "0.5.0"
log = "0.4.27"
dotenv = "0.15.0"
url = "2.5.4"
percent-encoding = "2.3.2"
comrak = { version = "0.58.0", default-features = false }
serde = { version = "1", features = ["derive"] }
